name: CI

# Déclenche le workflow à chaque push sur main
# et à chaque Pull Request vers main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================================
  # JOB 1 — Tests + barrière qualité
  # ==========================================================
  test:
    name: Tests et barrière qualité
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install --pre -r requirements-api.txt

      - name: Vérifier la barrière qualité
        run: python check_quality.py

      - name: Lancer les tests pytest
        run: pytest -v

  # ==========================================================
  # JOB 2 — Construire l'image Docker et vérifier qu'elle démarre
  # ==========================================================
  # "needs: test" garantit que ce job ne démarre QUE si le job
  # "test" a réussi. Si le test échoue, celui-ci est "skipped".
  # ==========================================================
  image:
    name: Build Docker et smoke test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t movie-classifier-api:ci .

      - name: Démarrer le conteneur
        run: docker run -d --name movie-api -p 8000:8000 movie-classifier-api:ci

      - name: Attendre que l'API soit prête (healthcheck)
        run: |
          echo "Attente du healthcheck..."
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' movie-api 2>/dev/null || echo "unknown")
            echo "  tentative $i/60 : $status"
            if [ "$status" = "healthy" ]; then
              echo "API prête"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout : l'API n'est pas devenue healthy"
          docker logs movie-api
          exit 1

      - name: Tester /health
        run: |
          curl -f http://localhost:8000/health \
            || (docker logs movie-api && exit 1)

      - name: Tester /predict (horreur)
        run: |
          response=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text":"A serial killer stalks and murders families in a haunted house at night."}')
          echo "Réponse reçue : $response"
          echo "$response" | grep -q "Horreur" \
            || (echo "La classe attendue 'Horreur' est absente"; docker logs movie-api; exit 1)
          echo "Prédiction correcte"

      - name: Logs du conteneur
        if: always()
        run: docker logs movie-api || true

      - name: Nettoyage
        if: always()
        run: |
          docker stop movie-api || true
          docker rm movie-api || true
